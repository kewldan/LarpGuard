# bot-shield configuration (M0). All keys are optional; values shown are the
# defaults unless marked otherwise. Unknown keys are rejected.

listen:
  https: "0.0.0.0:443"
  # Plain HTTP is passed through to Traefik (ACME HTTP-01, redirects).
  # Set to "" to leave port 80 to Traefik itself.
  http: "0.0.0.0:80"

# 0 = one worker per CPU. Workers share the ports via SO_REUSEPORT (Linux).
workers: 0

traefik:
  # Traefik's ACME storage, mounted read-only. Polled for changes.
  acme_json: /traefik/acme.json
  acme_reload_interval: 2s
  # Traefik entrypoints moved to loopback (see deploy/traefik.yml).
  upstream_https: "127.0.0.1:8443"
  upstream_http: "127.0.0.1:8080"
  # PROXY protocol v2 on passed-through connections (and port 80) so Traefik
  # sees real client addresses; needs proxyProtocol.trustedIPs on the
  # entrypoints. Terminated requests use X-Forwarded-For instead (needs
  # forwardedHeaders.trustedIPs), see deploy/traefik.yml.
  proxy_protocol: true
  # HTTP/2 connections to Traefik per SNI and worker; requests multiplex.
  pool_size: 4
  # Verify Traefik's certificate on the loopback hop.
  tls_verify: false

# Hosts never terminated here: other protocols over TLS. gRPC works through
# the gateway.
# Exact names or "*.parent".
passthrough_hosts: []
#  - grpc.example.com

# HTTPS-port traffic that is not TLS: reject | passthrough.
non_tls: reject
# ClientHello without SNI: reject | passthrough. Traefik routes passed-through
# TLS by the Host header, so passing these on would skip every check here;
# see also the TLS options in deploy/traefik-tls.yml.
no_sni: reject

timeouts:
  client_hello: 5s
  tls_handshake: 10s
  # Request headers: the first request within this time after the
  # handshake, later ones within this time after their first byte (HTTP/1.1)
  # or HEADERS frame (HTTP/2). Slow clients (slowloris) are closed.
  request_headers: 10s
  upstream_connect: 5s
  idle: 300s
  drain: 30s
  # Idle pooled HTTP/2 connections to Traefik are closed after this.
  upstream_idle: 90s

max_connections: 100000
# Requests per client connection; then HTTP/1.1 answers "Connection: close"
# and HTTP/2 sends GOAWAY, so the client reconnects past the connection
# limits again.
max_requests_per_connection: 1000

events:
  # NATS server for analytics events (subjects <subject_prefix>.conn and
  # <subject_prefix>.req, JSON). "" disables events and the HTTP taps.
  nats: ""
  # nats: "nats://127.0.0.1:4222"
  subject_prefix: botshield.events
  # Optional NATS auth: token, or user + password.
  token: ""
  user: ""
  password: ""
  # Events buffered while NATS is slow or down; the rest is dropped.
  max_queue: 100000
  # Key for IP hashes in events. "" = random per start (hashes then do not
  # match across restarts). Full client IPs are never sent.
  ip_salt: ""
  # One event per HTTP request, read passively from decrypted traffic.
  requests: true

# shadow: score every request, tell Traefik in X-Bot-* headers, never act.
# enforce: also act (block). Start in shadow and enable per host below.
mode: shadow

policy:
  # Score (0..100) from which a request is suspicious / a bot.
  thresholds: {suspicious: 30, bot: 70}
  # allow | challenge | captcha | block | tarpit | decoy | throttle
  # (challenge: JS page with proof of work; captcha: the CAPTCHA below, or
  # the challenge without one; tarpit: a very slow answer; decoy:
  # watermarked fake data; throttle: the throttle limit below applies).
  # verified_bot: search crawlers confirmed by reverse DNS (see crawlers).
  actions: {suspicious: allow, bot: block, verified_bot: allow}
  block_status: 403
  # Per-host mode overrides: exact names or "*.parent".
  hosts: {}
  #  shop.example.com: enforce

# Rules on top of the score, in order. First all "score" rules adjust the
# score; then the first matching "allow"/"block" rule overrides the action of
# the class (mode still decides whether it is carried out). Matches show up
# in X-Bot-Reasons and events as rule:<name>. Language: docs/architecture.md
# section 6.1.
rules: []
#  - name: monitoring
#    when: 'cidr("10.0.0.0/8") and header("x-monitor") == "secret"'
#    action: allow
#  - name: admin-scrapers
#    when: 'path ~ "/admin*" and class != "human"'
#    action: block
#  - name: checkout
#    when: 'path ~ "/checkout*" and class != "human"'
#    action: challenge
#  - name: mobile-app
#    when: 'ua_tool == "okhttp" and host == "api.example.com"'
#    action: score
#    score: -40

# Everything that decides verdicts (library, policy, rules, rate limits,
# throttle, honeypot paths, crawlers.ai, model) is reloaded without a
# restart on SIGHUP or POST /reload; other sections need a restart.

# Request rate limits (GCRA). Every matching limit counts the request; over
# a limit the answer is 429 with Retry-After on enforced hosts (shadow hosts
# only record it). Filters: hosts, paths (globs), methods, classes. Key parts:
# ip, ip_prefix, ja4, fp, host, session (challenge clearance token), asn
# (needs the asn database), header:<name>, cookie:<name>; a request
# missing a part is not limited by that rule. burst defaults to the count.
rate_limits: []
#  - name: login
#    paths: [/login]
#    methods: [POST]
#    key: [ip]
#    rate: 5/m
#  - name: bots
#    classes: [bot]
#    key: [ip_prefix]
#    rate: 30/m
#  - name: api
#    paths: ["/api/*"]
#    key: ["header:x-api-key"]
#    rate: 100/s
#    burst: 200

# Per-IP limits checked right after accept, before TLS. 0 / "" = off; mind
# clients sharing one address behind NAT.
connection_limits:
  open_per_ip: 0
  new_per_ip: ""
  new_burst_per_ip: 1
  # Connections per IP still before their first request's headers
  # (ClientHello, handshake, headers). Short-lived for real clients, so it is
  # on even behind NAT; 0 = off.
  pending_per_ip: 128

# botshield.* labels on containers (mode, passthrough, rate limits) read
# from the Docker Engine API. "" disables. Policies in this file (policy.hosts)
# take precedence over labels.
docker:
  socket: /var/run/docker.sock   # Not a default: off unless set.
  poll_interval: 5s

# Behaviour over a window per client (TLS fingerprint + network + host),
# shared by all workers: regular timing, many 404s, API calls without a
# page, pages without their assets (only on hosts whose assets go through
# the gateway), walking through IDs. Signals and weights are in the
# fingerprint library (behavior_*); weight 0 turns one off.
behavior:
  enabled: true
  window: 10m
  max_clients: 500000

# Honeypot paths (globs; only paths no site behind the gateway serves). A
# request to one scores "honeypot" and marks its address and fingerprint +
# network for ttl ("honeypot_client" on every host). Needs behavior.
honeypot:
  paths: ["/.env", "/.env.*", "/.git/*", "/.svn/*", "/.aws/*", "/.ssh/*",
          "/.DS_Store", "/wp-config.php*", "/.htpasswd", "/server-status",
          "/phpinfo.php"]
  ttl: 1h

# Action "throttle": requests it applies to also count against this limit
# (429 above it on enforced hosts). key: like rate_limits (default
# [ip_prefix, ja4]); "session" keys by the challenge clearance token.
# throttle:
#   rate: 30/m
#   burst: 10
#   key: [ip_prefix, ja4]

# Action "tarpit": 200 with a body that trickles out chunk bytes every
# interval for duration. Above max_active at once, blocked instead.
tarpit:
  duration: 30s
  interval: 1s
  chunk: 16
  max_active: 1000

# Action "decoy": 200 with fake data instead of the site, with a watermark
# ({{watermark}}, also in the req event) to recognize the data later.
# Empty: built-in catalog page (HTML for navigations, JSON otherwise).
decoy:
  html_file: ""
  json_file: ""

# HTTP/3: QUIC on the HTTPS port (UDP), same verdicts as TCP; advertised to
# clients with Alt-Svc. Traefik's HTTP/3 must stay off. Hosts without a
# certificate here (or passthrough hosts) refuse QUIC, so clients use TCP.
http3:
  enabled: false
  idle_timeout: 30s
  # Validate client addresses with a Retry before keeping state (one RTT).
  retry: true
  max_connections: 10000   # Per worker.
  alt_svc_max_age: 24h
  advertise_port: 0        # Port in Alt-Svc; 0 = the HTTPS listen port.

# Model signal (docs/architecture.md 6.1): gradient-boosted trees trained
# by tools/train_model.py from req events. Above threshold a request gets
# signal "model" (weight in the library). log_features puts the feature
# vector in req events: the training data; needs no model.
model:
  file: ""
  threshold: 0.8
  log_features: true

# Known crawlers. A request whose User-Agent claims a search engine (Google,
# Bing, Yandex, Apple, Baidu, ...) is checked by reverse and forward DNS in
# the background: verified ones get class verified_bot, fakes the
# fake_crawler signal. AI crawlers (GPTBot, ClaudeBot, CCBot, ...) are
# recognized by User-Agent and get the "ai" action (default: scored like
# anyone; allow | challenge | captcha | block). Rules and admin lists
# still win.
crawlers:
  verify: true
  ai: default
  # Published IP ranges (Google, Bing, Apple, DuckDuckGo, OpenAI,
  # Perplexity, Mistral), downloaded in the background: inside them a claim
  # is verified at once; outside them a crawler without reverse DNS
  # (GPTBot, PerplexityBot, ...) is a fake_crawler.
  ip_ranges: true
  ranges_refresh: 24h

# Web Bot Auth (HTTP Message Signatures, RFC 9421, tag "web-bot-auth"):
# bots sign requests and name their key directory in Signature-Agent. The
# keys are fetched in the background. A valid signature from a trusted
# agent (host or "*.parent") makes a verified bot (verified_agent:<host>);
# from others it is recorded (signed_agent:<host>); a wrong one scores
# web_bot_auth_invalid. Ed25519 only.
web_bot_auth:
  enabled: true
  trusted: ["chatgpt.com"]
  # Longer-lived signatures are refused: they work like replayable tokens.
  max_validity: 24h

# IP -> autonomous system database (iptoasn.com, public domain), downloaded
# in the background. Gives the rule fields asn, asn_org, asn_country,
# asn_hosting, the rate limit key asn, the "asn" event field and the
# hosting_network signal (clouds and hosters). "" = off.
asn:
  url: "https://iptoasn.com/data/ip2asn-combined.tsv.gz"
  refresh: 24h

# Downloads (crawler ranges, ASN database) are cached here and survive
# restarts; "" = memory only (downloaded again on every start).
data_dir: /var/lib/bot-shield/data   # Not a default: off unless set.
# CA bundle for those downloads, CAPTCHA providers and key directories;
# "" = the system's.
ca_file: ""

# CAPTCHA (action "captcha", docs/architecture.md 7.1): "" (off), builtin,
# turnstile, hcaptcha or recaptcha. Solving it sets a level-2 __bs token.
#   builtin: "click the shape that matches the sample", rendered here, in
#     `rounds` rounds of at most round_timeout each; bound to the browser
#     that ran the probes, one-time, with a hand-like pointer path required.
#   turnstile | hcaptcha | recaptcha: the provider's widget, checked with its
#     siteverify (site_key, secret_file) in the background.
# escalate: a JS challenge that looks suspicious (DevTools protocol, a
# spoofed User-Agent, ...) or unusual (software renderer, headless screen)
# shows the CAPTCHA instead of failing or passing.
captcha:
  provider: ""
  site_key: ""
  secret_file: ""
  verify_url: ""        # "" = the provider's siteverify.
  check_hostname: true
  escalate: true
  rounds: 2
  round_timeout: 30s
  difficulty: 12        # Proof of work on the CAPTCHA page.

# XDP pre-filter (Linux; ADR-016): a BPF program on the interface drops,
# before the TCP stack, packets for the gateway's ports from IP/CIDR block
# entries of the admin lists, SYN floods per /24 or /64 (syn_rate), invalid
# TCP flags and UDP when http3 is off. It passes everything once the
# gateway stops beating for heartbeat_timeout, and goes away with the
# process (fail-open). Needs CAP_BPF and CAP_NET_ADMIN.
xdp:
  enabled: false
  interface: ""          # Required when enabled, e.g. eth0.
  mode: auto             # auto (native, else generic) | native | generic
  syn_rate: 0            # New connections per second per prefix; 0 = off.
  syn_burst: 1
  drop_invalid: true
  drop_fragments: false  # Also drops fragmented packets to any port.
  heartbeat_timeout: 5s
  # Honeypot hits are also dropped here for honeypot.ttl.
  block_honeypot: false

# JS challenge (action "challenge"): browsers get a page that checks a few
# signals and solves a proof of work, then a __bs cookie (bound to the TLS
# fingerprint and /24) that takes token_credit off the score. Paths under
# /__bs/ are reserved on every host; the cookie never reaches Traefik.
challenge:
  # {"active": "k1", "keys": {"k1": "<base64, >= 32 bytes>"}}; list old keys
  # next to a new active one to rotate. "" = random key per start.
  keys_file: ""
  token_ttl: 12h
  # Leading zero bits of SHA-256 (~1M hashes/s per core in a browser).
  difficulty: {suspicious: 16, bot: 19}
  token_credit: 40
  # /__bs/* (challenge pages, solutions) per client IP. They are answered
  # here and bypass rate_limits.
  endpoint_rate: 30/m
  endpoint_burst: 10

# Under-attack mode: every client without a valid __bs token gets the
# challenge (shadow hosts too; allow rules, allow lists and verified crawlers
# pass). Switched per host or for all ("*") by the admin API:
#   POST /attack {"host": "shop.example.com", "ttl": "1h"}, DELETE /attack/<host>
# or automatically for a host whose rate stays above auto_rps for ~10 s.
attack:
  # Requests per second per host; 0 = admin API only.
  auto_rps: 0
  auto_duration: 10m

# Admin API (JSON over a unix socket, mode 0600; no TCP port):
#   curl --unix-socket /run/bot-shield/admin.sock http://bot-shield/status
# GET /status, GET /config, GET|POST /policy, DELETE /policy/<host>,
# GET|POST /lists, DELETE /lists/<id>, GET /decisions[?limit=&host=&class=],
# GET /decisions/<request id>, GET|POST /attack, DELETE /attack/<host>,
# POST /rules/test, GET /asn?numbers=, POST /reload. The web console
# (ui/, deploy/console.yaml) uses it.
admin:
  socket: /run/bot-shield/admin.sock   # Not a default: off unless set.
  # Operational allow/block lists survive restarts here ("" = memory only).
  state_file: /var/lib/bot-shield/lists.json   # Not a default.
  # Host modes set from the console (POST /policy) survive restarts here;
  # they beat policy.hosts and labels ("" = memory only).
  modes_file: /var/lib/bot-shield/modes.json   # Not a default.
  # Recent decisions kept in memory for GET /decisions.
  decisions: 10000

fingerprints:
  # Fingerprint library; "" = built in (same as deploy/fingerprints.yaml).
  library: ""

metrics:
  # Prometheus /metrics and /health. "" disables.
  listen: "127.0.0.1:9900"

log_level: info
