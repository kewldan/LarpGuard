# Example: Traefik and bot-shield on one host. Both use host networking so
# bot-shield sees real client SYNs and reaches Traefik on loopback. Traefik
# listens on :8443/:8080; the watchdog's nftables table closes them from
# outside and redirects :443/:80 to them while bot-shield is down.
services:
  traefik:
    image: traefik:v3.5
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-tls.yml:/etc/traefik/traefik-tls.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/acme   # acme.json lives here

  bot-shield:
    # Prebuilt multi-arch image (amd64, arm64) from CI; replace with
    # `build: ..` to build from this checkout.
    image: ghcr.io/kewldan/larpguard:latest
    network_mode: host
    restart: unless-stopped
    # Runs as root so it can read acme.json (Traefik requires mode 0600), but
    # with every capability dropped except binding to ports below 1024.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - ./bot-shield.yaml:/etc/bot-shield/bot-shield.yaml:ro
      - traefik-acme:/traefik:ro
      # botshield.* labels; read-only, like Traefik's docker provider.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Admin socket (reach it from the host) and saved operational lists.
      - /run/bot-shield:/run/bot-shield
      - bot-shield-state:/var/lib/bot-shield
    depends_on: [traefik, nats]

  # Fail-open (docs/architecture.md, section 11). Needs NET_ADMIN on the
  # host network namespace for nftables.
  bot-shield-watchdog:
    image: ghcr.io/kewldan/larpguard:latest
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      # Only for notify: fail-open on and off go to its destinations.
      - ./bot-shield.yaml:/etc/bot-shield/bot-shield.yaml:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        nft -f /etc/bot-shield/failopen/bot-shield.nft &&
        exec bot-shield-watchdog --health 127.0.0.1:9900
        --on-fail 'nft -f /etc/bot-shield/failopen/failopen-on.nft'
        --on-recover 'nft -f /etc/bot-shield/failopen/failopen-off.nft'
        --config /etc/bot-shield/bot-shield.yaml

  # Web console (ui/, deploy/console.yaml). Listens on 127.0.0.1:9901; publish
  # it through a Traefik router of its own. Runs as root to reach the admin
  # socket (mode 0600, owned by root like the gateway), with every
  # capability dropped.
  console:
    image: ghcr.io/kewldan/larpguard-console:latest
    network_mode: host
    restart: unless-stopped
    # The admin socket's owner (0600). With no capabilities root writes
    # console-state through the group bits the image sets.
    user: "0:0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - ./console.yaml:/etc/larpguard/console.yaml:ro
      - /run/bot-shield:/run/bot-shield
      - console-state:/var/lib/larpguard
    depends_on: [bot-shield, clickhouse]

  # Analytics pipeline (optional): bot-shield -> NATS -> ClickHouse.
  # Enable with events.nats: "nats://127.0.0.1:4222" in bot-shield.yaml.
  nats:
    image: nats:2.11
    command: ["-js", "-sd", "/data"]
    restart: unless-stopped
    ports: ["127.0.0.1:4222:4222"]
    volumes:
      - nats-data:/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    ports: ["127.0.0.1:8123:8123"]
    environment:
      CLICKHOUSE_DB: bot_shield
    volumes:
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - clickhouse-data:/var/lib/clickhouse
    depends_on: [nats]

volumes:
  traefik-acme:
  bot-shield-state:
  console-state:
  nats-data:
  clickhouse-data:
