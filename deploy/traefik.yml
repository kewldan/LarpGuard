# Traefik static configuration changes for running behind bot-shield.
# Only the entrypoints change: routers, middlewares, certificate resolvers and
# container labels stay as they are.

entryPoints:
  web:
    # Was ":80".
    address: "127.0.0.1:8080"
    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/32"
  websecure:
    # Was ":443".
    address: "127.0.0.1:8443"
    # Passed-through TLS arrives with a PROXY v2 header; Traefik uses it when
    # present and accepts connections without it.
    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/32"
    # Terminated requests arrive over pooled HTTP/2 connections and carry the
    # client address in X-Forwarded-For / X-Real-IP set by bot-shield.
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
    # Keep HTTP/3 off: QUIC would bypass bot-shield (ADR-011).
    # http3: {}

# certificatesResolvers stay unchanged; bot-shield reads their acme.json.
