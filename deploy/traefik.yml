# Traefik static configuration changes for running behind bot-shield.
# The entrypoints move to loopback, plain HTTP is redirected to HTTPS and the
# TLS options in traefik-tls.yml are loaded. Routers, middlewares,
# certificate resolvers and container labels stay as they are, except that
# routers of passthrough hosts get tls.options=passthrough@file.

entryPoints:
  web:
    # Was ":80".
    address: "127.0.0.1:8080"
    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/32"
    # Port 80 is passed through to here unchecked: serve nothing but the
    # redirect (ACME HTTP-01 challenges are answered before it). The target
    # is the public port; "websecure" would point clients at 8443.
    http:
      redirections:
        entryPoint:
          to: ":443"
          scheme: https
  websecure:
    # Was ":443".
    address: "127.0.0.1:8443"
    # Passed-through TLS arrives with a PROXY v2 header; Traefik uses it when
    # present and accepts connections without it.
    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/32"
    # Terminated requests arrive over pooled HTTP/2 connections and carry the
    # client address in X-Forwarded-For / X-Real-IP set by bot-shield.
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
    # Keep HTTP/3 off: QUIC would bypass bot-shield (ADR-011).
    # http3: {}

# TLS options against SNI/Host mismatches (see traefik-tls.yml). Keep any
# file provider you already have and add the file to its directory.
providers:
  file:
    filename: /etc/traefik/traefik-tls.yml

# certificatesResolvers stay unchanged; bot-shield reads their acme.json.
