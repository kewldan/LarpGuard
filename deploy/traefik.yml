# Traefik static configuration changes for running behind bot-shield.
# Only the entrypoints change: routers, middlewares, certificate resolvers and
# container labels stay as they are.

entryPoints:
  web:
    # Was ":80".
    address: "127.0.0.1:8080"
    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/32"
  websecure:
    # Was ":443".
    address: "127.0.0.1:8443"
    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/32"
    # Keep HTTP/3 off: QUIC would bypass bot-shield (ADR-011).
    # http3: {}

# certificatesResolvers stay unchanged; bot-shield reads their acme.json.
