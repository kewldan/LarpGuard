name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Same LLVM tools as local development (pinned wheels from PyPI).
  CLANG_FORMAT_VERSION: "23.1.3"
  CLANG_TIDY_VERSION: "23.1.3"
  IMAGE: ghcr.io/${{ github.repository_owner }}/larpguard

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: clang-format --dry-run --Werror
        run: >-
          git ls-files -z 'src/*.cc' 'src/*.h' 'tests/*.cc' 'tests/*.h'
          | xargs -0 clang-format --dry-run --Werror

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Privileged: the XDP tests load their BPF program into the runner's
    # kernel (BPF_PROG_TEST_RUN); elsewhere they are skipped.
    container:
      image: debian:trixie
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build & test
            build_type: RelWithDebInfo
            cmake_flags: ""
          - name: ASan + UBSan
            build_type: Debug
            cmake_flags: -DBOT_SHIELD_SANITIZE=ON
          - name: Lint (clang-tidy)
            build_type: Debug
            cmake_flags: ""
            tidy: true
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git python3 python3-venv \
            openssl curl nodejs clang ca-certificates ccache
      - uses: actions/checkout@v7
      - name: Install clang-tidy
        if: matrix.tidy
        run: |
          python3 -m venv /opt/llvm
          /opt/llvm/bin/pip install "clang-tidy==${CLANG_TIDY_VERSION}"
          echo /opt/llvm/bin >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.name }}-
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          ${{ matrix.cmake_flags }}
      - name: Build
        run: cmake --build build
      - name: Unit tests
        if: ${{ !matrix.tidy }}
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"
      - name: XDP tests ran
        if: ${{ !matrix.tidy }}
        run: |
          ./build/tests/bot_shield_tests --gtest_filter='XdpTest.*' \
            | tee /tmp/xdp.log
          ! grep -q SKIPPED /tmp/xdp.log
      - name: End-to-end tests
        if: ${{ !matrix.tidy }}
        run: python3 -I tests/e2e/run_e2e.py build/src/bot-shield
      - name: clang-tidy
        if: matrix.tidy
        run: cmake --build build --target tidy
      - run: ccache --show-stats

  image:
    name: Image (${{ matrix.platform }})
    needs: [format, test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Platform slug
        run: echo "SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.SLUG }}
          cache-to: type=gha,scope=${{ env.SLUG }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.SLUG }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Publish image
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest = main; vX.Y.Z tags also get X.Y and X; every build gets
          # sha-<short>.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          tags=()
          while read -r tag; do tags+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
